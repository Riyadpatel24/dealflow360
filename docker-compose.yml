services:
  postgres:
    image: postgres:17
    container_name: dealflow360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: dealflow360
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: